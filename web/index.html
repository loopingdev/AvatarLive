<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hubie Live 24/7 — Housebets Mascot Streamer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="stream-container">
    <!-- 1. FULLSCREEN EDGE-TO-EDGE LIVE HOUSEBETS SCREEN -->
    <div class="live-screen-wrapper">
      <img id="live-screencast" alt="Live Housebets Gameplay" />
      <div class="screen-loading" id="screen-loading">
        <div class="spinner"></div>
        <span>Connecting to Housebets Live Game...</span>
      </div>
    </div>

    <!-- 2. FLOATING AUTO-FADING STREAM CHAT (Zero static boxes, only appears when a message arrives) -->
    <div id="chat-messages" class="floating-chat-stream"></div>

    <!-- 3. FULL-SCREEN AVATAR OVERLAY (Hubie Roams & Speaks Over Stream) -->
    <div id="avatar-stage">
      <div id="speech-bubble"></div>
      <canvas id="avatar-canvas" width="1920" height="1080"></canvas>
    </div>
  </div>

  <!-- Hidden Audio Player for Live Neural TTS -->
  <audio id="tts-audio" preload="auto"></audio>

  <!-- Load Avatar Script -->
  <script src="/hubie_avatar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const avatar = new HubieAvatar('avatar-canvas', 'speech-bubble');
      window.avatar = avatar;
      const audioElement = document.getElementById('tts-audio');

      const screencastImg = document.getElementById('live-screencast');
      const screenLoading = document.getElementById('screen-loading');
      const chatMessagesEl = document.getElementById('chat-messages');

      // WebSocket Connection
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleServerMessage(msg);
        } catch (e) {
          console.error('WS Parse Error:', e);
        }
      };

      function handleServerMessage(msg) {
        if (msg.type === 'screencast_frame') {
          screencastImg.src = msg.data;
          if (screenLoading && screenLoading.style.display !== 'none') {
            screenLoading.style.display = 'none';
          }
        } else if (msg.type === 'game_update') {
          const payload = msg.data;
          if (payload.type === 'game_switched') {
            const gameTitle = payload.game_state?.display_name || payload.game_state?.game_name;
            console.log('[Hubie Stream] Game switched to:', gameTitle);
            avatar.onGameChanged(gameTitle);
          } else if (payload.type === 'round_result') {
            const res = payload.event_data;
            if (res.won) {
              avatar.reactToWin(res.multiplier || 2.0);
            } else {
              avatar.reactToLoss();
            }
          }
        } else if (msg.type === 'hubie_speaking_start') {
          avatar.setSpeaking(true, msg.text);
          if (msg.audio_url) {
            audioElement.src = msg.audio_url;
            audioElement.play().catch(() => {});
          }
        } else if (msg.type === 'hubie_speaking_end') {
          avatar.setSpeaking(false);
        } else if (msg.type === 'chat_message') {
          appendChatMessage(msg.message.user, msg.message.text, msg.message.platform);
          const lower = msg.message.text.toLowerCase();
          if (lower.includes('hubie')) {
            avatar.reactToChat(msg.message.user);
          }
          if (lower.includes('!costume') || lower.includes('!outfit') || lower.includes('change clothes')) {
            if (lower.includes('spooky') || lower.includes('halloween') || lower.includes('witch')) avatar.triggerCostumeChangeRoutine('halloween');
            else if (lower.includes('classic') || lower.includes('gent') || lower.includes('suit')) avatar.triggerCostumeChangeRoutine('classic');
            else avatar.triggerCostumeChangeRoutine();
          }
        } else if (msg.type === 'chat_moderated') {
          appendModeratedNotice(msg.message.user);
        }
      }

      // 16 Vibrant Streamer Username Colors (Persistent by username hash)
      const USER_COLORS = [
        '#00ffcc', '#ff007f', '#ffd700', '#00e5ff', 
        '#a855f7', '#ff6b00', '#38bdf8', '#4ade80', 
        '#f43f5e', '#ec4899', '#818cf8', '#2dd4bf',
        '#fbbf24', '#34d399', '#f87171', '#c084fc'
      ];

      function getUserColor(username) {
        let hash = 0;
        const str = String(username || 'viewer');
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return USER_COLORS[Math.abs(hash) % USER_COLORS.length];
      }

      // Streamer Floating Chat Messages (Auto-fades after 8 seconds, zero persistent box)
      function appendChatMessage(user, text, platform) {
        const item = document.createElement('div');
        item.className = 'chat-item';
        const color = getUserColor(user);
        item.style.setProperty('--user-color', color);

        let badge = '<span class="chat-badge live">LIVE</span>';
        if (platform === 'kick') {
          badge = '<span class="chat-badge kick">KICK</span>';
        } else if (platform === 'twitch') {
          badge = '<span class="chat-badge twitch">TWITCH</span>';
        }

        item.innerHTML = `${badge}<span class="chat-user" style="color: ${color}; text-shadow: 0 0 10px ${color}88;">@${escapeHtml(user)}:</span><span class="chat-text">${escapeHtml(text)}</span>`;
        chatMessagesEl.appendChild(item);

        // Limit visible stack to at most 6 messages
        if (chatMessagesEl.children.length > 6) {
          chatMessagesEl.removeChild(chatMessagesEl.firstChild);
        }

        // Auto-fade after 8 seconds, remove after 9 seconds (just like Twitch/Kick stream overlays!)
        setTimeout(() => {
          item.classList.add('fade-out');
          setTimeout(() => {
            if (item.parentNode) item.parentNode.removeChild(item);
          }, 800);
        }, 8000);
      }

      function appendModeratedNotice(user) {
        const item = document.createElement('div');
        item.className = 'chat-item moderated';
        item.innerHTML = `<span class="chat-mod-notice">🛡️ [Auto-Mod] Removed toxic message from @${escapeHtml(user)}</span>`;
        chatMessagesEl.appendChild(item);
        setTimeout(() => {
          item.classList.add('fade-out');
          setTimeout(() => {
            if (item.parentNode) item.parentNode.removeChild(item);
          }, 800);
        }, 6000);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Auto-scale full-screen borderless overlay to fit any resolution or OBS canvas
      const container = document.getElementById('stream-container');
      function resizeOverlay() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        if (container) {
          container.style.transform = `scale(${scale})`;
          container.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
          container.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
        }
      }
      window.addEventListener('resize', resizeOverlay);
      resizeOverlay();

      // Poll telemetry every second
      setInterval(async () => {
        try {
          const res = await fetch('/api/status');
          if (res.ok) {
            const data = await res.json();
            updateTelemetry(data);
          }
        } catch {}
      }, 1000);
    });
  </script>
</body>
</html>
