<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hubie Live 24/7 — Housebets Mascot Streamer</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="stream-container">
    <!-- 1. FULLSCREEN EDGE-TO-EDGE LIVE HOUSEBETS SCREEN -->
    <div class="live-screen-wrapper">
      <img id="live-screencast" alt="" />
      <div class="screen-loading" id="screen-loading">
        <div class="spinner"></div>
        <div class="loading-title">Hubie Live 24/7</div>
        <div class="loading-subtitle" id="loading-status">Connecting to Housebets Live Game...</div>
      </div>
    </div>

    <!-- 2. FLOATING AUTO-FADING STREAM CHAT (Zero static boxes, only appears when a message arrives) -->
    <div id="chat-messages" class="floating-chat-stream"></div>


    <!-- 3. FULL-SCREEN AVATAR OVERLAY (Hubie Roams & Speaks Over Stream) -->
    <div id="avatar-stage">
      <div id="speech-bubble"></div>
      <canvas id="avatar-canvas" width="1920" height="1080"></canvas>
    </div>
  </div>

  <!-- Hidden Audio Player for Live Neural TTS -->
  <audio id="tts-audio" preload="auto"></audio>

  <!-- Interactive Remote Control & Manual Login Toolbar (auto-hidden on /overlay) -->
  <div id="remote-control-dock" class="remote-control-dock">
    <div class="dock-header">
      <span class="dock-badge">🎮 VPS REMOTE CONTROL</span>
      <button id="toggle-pause-btn" class="dock-btn btn-warning" title="Pause bot automation so you can interact and log in cleanly">⏸️ Pause Bot Loop</button>
      <button id="save-session-btn" class="dock-btn btn-success" title="Save cookies and login session permanently to disk">💾 Save Session</button>
      <button id="control-toggle-btn" class="dock-btn btn-primary" title="Toggle clicking directly on the screen">🖱️ Screen Click: Active</button>
      <button id="dock-minimize-btn" class="dock-btn btn-ghost" title="Minimize / Expand toolbar">_</button>
    </div>
    <div class="dock-body" id="dock-body">
      <div class="dock-row">
        <span class="dock-hint">💡 Click anywhere on the Housebets game screen to click buttons/inputs. Type below to send text:</span>
      </div>
      <div class="dock-row">
        <input type="text" id="remote-text-input" placeholder="Type email, password, or 2FA code here..." class="dock-input" autocomplete="off" />
        <button id="remote-type-btn" class="dock-btn btn-accent" title="Send typed text directly into focused field on VPS">⌨️ Send Text</button>
        <button id="remote-key-tab" class="dock-btn btn-secondary" title="Press Tab key to jump to next input field">Tab ⇥</button>
        <button id="remote-key-enter" class="dock-btn btn-success" title="Press Enter key to submit login">Enter ⏎</button>
        <button id="remote-key-backspace" class="dock-btn btn-secondary" title="Press Backspace">⌫ Back</button>
        <button id="remote-reload-btn" class="dock-btn btn-secondary" title="Reload Housebets page">🔄 Reload Page</button>
      </div>
    </div>
  </div>

  <!-- Load Avatar Script -->
  <script src="/hubie_avatar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const avatar = new HubieAvatar('avatar-canvas', 'speech-bubble');
      window.avatar = avatar;
      const audioElement = document.getElementById('tts-audio');

      // Audio Autoplay Policy Unlock (browser requires user gesture to play sound)
      let audioUnlocked = false;
      function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        audioElement.play().then(() => {
          audioElement.pause();
          audioElement.currentTime = 0;
        }).catch(() => {});
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
      }
      window.addEventListener('click', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);
      window.addEventListener('keydown', unlockAudio);

      const screencastImg = document.getElementById('live-screencast');
      const screenLoading = document.getElementById('screen-loading');
      const chatMessagesEl = document.getElementById('chat-messages');

      // WebSocket Connection with Auto-Reconnect Engine
      let ws = null;
      let wsReconnectTimeout = null;

      function connectWebSocket() {
        if (wsReconnectTimeout) clearTimeout(wsReconnectTimeout);
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws`);

        ws.onopen = () => {
          console.log('[Hubie WS] Live WebSocket connected successfully.');
          const dot = document.getElementById('connection-status-dot');
          if (dot) dot.classList.add('connected');
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleServerMessage(msg);
          } catch (e) {
            console.error('WS Parse Error:', e);
          }
        };

        ws.onclose = () => {
          console.warn('[Hubie WS] Connection lost. Reconnecting in 2.5s...');
          const dot = document.getElementById('connection-status-dot');
          if (dot) dot.classList.remove('connected');
          wsReconnectTimeout = setTimeout(connectWebSocket, 2500);
        };

        ws.onerror = () => {
          try { ws.close(); } catch { }
        };
      }
      connectWebSocket();

      function handleServerMessage(msg) {
        if (msg.type === 'session_saved') {
          showToast(msg.ok ? '💾 Cookies & Session saved permanently!' : '⚠️ Failed to save session');
        } else if (msg.type === 'bot_pause_status') {
          updateBotPauseState(msg.paused);
        } else if (msg.type === 'screencast_frame' && msg.data) {
          screencastImg.src = msg.data;
          if (!screencastImg.classList.contains('loaded')) {
            screencastImg.classList.add('loaded');
          }
          if (screenLoading && screenLoading.style.display !== 'none') {
            screenLoading.style.display = 'none';
          }
        } else if (msg.type === 'game_update') {
          const payload = msg.data;
          if (payload.type === 'game_switched') {
            const gameTitle = payload.game_state?.display_name || payload.game_state?.game_name;
            console.log('[Hubie Stream] Game switched to:', gameTitle);
            avatar.onGameChanged(gameTitle);
          } else if (payload.type === 'round_result') {
            const res = payload.event_data;
            const mult = Number(res.multiplier || 0);
            if (mult > 1.6) {
              // Crazy Win (> 1.6x): Scream like crazy, confetti explosion, hype dance!
              avatar.reactToWin(mult);
              avatar.triggerConfetti();
              avatar.startHypeDance(4800);
            } else if (res.won && mult > 1.0) {
              avatar.reactToWin(mult);
            } else {
              avatar.reactToLoss();
            }
          }
        } else if (msg.type === 'hubie_speaking_start') {
          avatar.setSpeaking(true, msg.text);
          if (msg.audio_url) {
            audioElement.src = msg.audio_url;
            audioElement.play().catch((err) => {
              console.warn('[Hubie Audio] Autoplay blocked by browser. Click anywhere on the overlay to enable sound:', err);
            });
          }
        } else if (msg.type === 'hubie_speaking_end') {
          avatar.setSpeaking(false);
        } else if (msg.type === 'chat_message') {
          appendChatMessage(msg.message.user, msg.message.text, msg.message.platform);
          const lower = (msg.message.text || '').toLowerCase().trim();

          // Help / Commands Viewer Command - Nightbot displays commands in chat (overlay modal suppressed)
          if (lower.startsWith('!commands') || lower.startsWith('!command') || lower.startsWith('!help') || lower.startsWith('!poses') || lower.startsWith('!pose') || lower.startsWith('!menu')) {
            avatar.playSpecialPose('flag', 2500);
            avatar.setSpeaking(true, `@${msg.message.user} check Twitch chat! Nightbot has all my commands listed there! 📜🎮`);
          }
          // Viewer Outfit / Costume Wardrobe Commands
          else if (lower.startsWith('!costume') || lower.startsWith('!outfit') || lower.startsWith('!skin')) {
            if (lower.includes('spooky') || lower.includes('halloween') || lower.includes('witch') || lower.includes('cape')) {
              avatar.triggerCostumeChangeRoutine('halloween');
            } else if (lower.includes('classic') || lower.includes('gent') || lower.includes('og') || lower.includes('tophat')) {
              avatar.triggerCostumeChangeRoutine('classic');
            } else {
              avatar.triggerCostumeChangeRoutine();
            }
          }
          // Direct Viewer Pose & Action Commands (The avatar moves freely and never loses animation)
          else if (lower.startsWith('!dance') || lower.startsWith('!disco')) {
            avatar.startHypeDance(4200);
            avatar.triggerConfetti();
            avatar.setSpeaking(true, `Disco dance party for @${msg.message.user}! Let's groove! 🕺`);
          } else if (lower.startsWith('!surf') || lower.startsWith('!surfing') || lower.startsWith('!wave')) {
            avatar.startSurfCruise();
            avatar.setSpeaking(true, `Surfing the multiplier wave for @${msg.message.user}! 🏄`);
          } else if (lower.startsWith('!flex') || lower.startsWith('!muscle') || lower.includes('!pose flex')) {
            avatar.playSpecialPose('flex', 3500);
            avatar.setSpeaking(true, `Flex check for @${msg.message.user}! Hubie strength in the house! 💪`);
          } else if (lower.startsWith('!boss') || lower.startsWith('!suit') || lower.includes('!pose boss')) {
            avatar.playSpecialPose('boss', 3500);
            avatar.setSpeaking(true, `Boss stance activated for @${msg.message.user}! Big moves today! 💼`);
          } else if (lower.startsWith('!flag') || lower.startsWith('!waveflag') || lower.includes('!pose flag')) {
            avatar.playSpecialPose('flag', 3500);
            avatar.setSpeaking(true, `Waving the Housebets victory flag for @${msg.message.user}! 🚩`);
          } else if (lower.startsWith('!snack') || lower.startsWith('!eat') || lower.startsWith('!orange') || lower.includes('!pose snack')) {
            avatar.playSpecialPose('snack', 3500);
            avatar.setSpeaking(true, `Orange slice snack break for @${msg.message.user}! 🍊 Energy restored!`);
          } else if (lower.startsWith('!blush') || lower.startsWith('!love') || lower.startsWith('!heart') || lower.includes('!pose blush')) {
            avatar.playSpecialPose('blush', 3500);
            avatar.setSpeaking(true, `Aw, thank you @${msg.message.user}! Much love squad! 💕`);
          } else if (lower.startsWith('!whistle') || lower.startsWith('!music') || lower.includes('!pose whistle')) {
            avatar.playSpecialPose('whistle', 3500);
            avatar.setSpeaking(true, `Whistling into the multiplier zone for @${msg.message.user}! 🎶`);
          } else if (lower.startsWith('!card') || lower.startsWith('!highroller') || lower.startsWith('!chips') || lower.includes('!pose card')) {
            avatar.playSpecialPose('highroller', 3500);
            avatar.setSpeaking(true, `Ace up the sleeve for @${msg.message.user}! Playing with style! 🃏`);
          } else if (lower.startsWith('!magnifier') || lower.startsWith('!inspect') || lower.startsWith('!search') || lower.includes('!pose magnifier')) {
            avatar.playSpecialPose('magnifier', 3500);
            avatar.setSpeaking(true, `Inspecting the multipliers closely for @${msg.message.user}! 🔍`);
          } else {
            avatar.reactToChat(msg.message.user);
          }
        } else if (msg.type === 'chat_moderated') {
          appendModeratedNotice(msg.message.user);
        }
      }

      // 16 Vibrant Streamer Username Colors (Persistent by username hash)
      const USER_COLORS = [
        '#00ffcc', '#ff007f', '#ffd700', '#00e5ff',
        '#a855f7', '#ff6b00', '#38bdf8', '#4ade80',
        '#f43f5e', '#ec4899', '#818cf8', '#2dd4bf',
        '#fbbf24', '#34d399', '#f87171', '#c084fc'
      ];

      function getUserColor(username) {
        let hash = 0;
        const str = String(username || 'viewer');
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return USER_COLORS[Math.abs(hash) % USER_COLORS.length];
      }

      // Streamer Floating Chat Messages (Configured to stay on screen for 28 seconds so viewers and streamer can comfortably read)
      function appendChatMessage(user, text, platform) {
        const item = document.createElement('div');
        item.className = 'chat-item';
        const color = getUserColor(user);
        item.style.setProperty('--user-color', color);

        const isCommand = (text || '').startsWith('!') || (text || '').toLowerCase().includes('@hubie');
        if (isCommand) {
          item.classList.add('command-highlight');
        }

        let badge = '<span class="chat-badge live">LIVE</span>';
        if (platform === 'kick') {
          badge = '<span class="chat-badge kick">KICK</span>';
        } else if (platform === 'twitch') {
          badge = '<span class="chat-badge twitch">TWITCH</span>';
        }

        item.innerHTML = `${badge}<span class="chat-user" style="color: ${color}; text-shadow: 0 0 10px ${color}88;">@${escapeHtml(user)}:</span><span class="chat-text">${escapeHtml(text)}</span>`;
        chatMessagesEl.appendChild(item);

        // Limit visible stack to at most 8 messages (scrolls upward nicely)
        if (chatMessagesEl.children.length > 8) {
          chatMessagesEl.removeChild(chatMessagesEl.firstChild);
        }

        // Auto-fade duration: 28 seconds for standard comments, 34 seconds for viewer commands
        const stayDuration = isCommand ? 34000 : 28000;
        setTimeout(() => {
          item.classList.add('fade-out');
          setTimeout(() => {
            if (item.parentNode) item.parentNode.removeChild(item);
          }, 1200);
        }, stayDuration);
      }

      function appendModeratedNotice(user) {
        const item = document.createElement('div');
        item.className = 'chat-item moderated';
        item.innerHTML = `<span class="chat-mod-notice">🛡️ [Auto-Mod] Removed toxic message from @${escapeHtml(user)}</span>`;
        chatMessagesEl.appendChild(item);
        setTimeout(() => {
          item.classList.add('fade-out');
          setTimeout(() => {
            if (item.parentNode) item.parentNode.removeChild(item);
          }, 1200);
        }, 12000);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Streamer Interactive Local Command Tester
      const toggleTestDockBtn = document.getElementById('toggle-test-dock');
      const testDockPanel = document.getElementById('test-dock-panel');
      const testChatForm = document.getElementById('test-chat-form');
      const testChatInput = document.getElementById('test-chat-input');

      if (toggleTestDockBtn && testDockPanel) {
        toggleTestDockBtn.addEventListener('click', () => {
          testDockPanel.classList.toggle('hidden');
          if (!testDockPanel.classList.contains('hidden') && testChatInput) {
            testChatInput.focus();
          }
        });
      }

      async function sendTestChatMessage(text) {
        const clean = (text || '').trim();
        if (!clean) return;
        try {
          await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: 'thehustler2030', text: clean })
          });
        } catch (e) {
          console.error('Failed to send test chat:', e);
        }
      }

      if (testChatForm && testChatInput) {
        testChatForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = testChatInput.value.trim();
          if (val) {
            sendTestChatMessage(val);
            testChatInput.value = '';
          }
        });
      }

      document.querySelectorAll('.test-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const cmd = btn.getAttribute('data-cmd');
          if (cmd) sendTestChatMessage(cmd);
        });
      });

      // Hotkey: press '`' (backtick) or 't' to quickly open test bar when in browser
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === '`' || e.key === '~' || e.key.toLowerCase() === 't') {
          if (testDockPanel) testDockPanel.classList.toggle('hidden');
        }
      });

      // ==========================================
      // VPS REMOTE CONTROL & MANUAL LOGIN ENGINE
      // ==========================================
      const isOverlay = location.pathname.startsWith('/overlay');
      const remoteDock = document.getElementById('remote-control-dock');
      if (isOverlay && remoteDock) {
        remoteDock.style.display = 'none';
      }

      let remoteControlActive = true;
      let isBotPaused = false;

      const controlToggleBtn = document.getElementById('control-toggle-btn');
      const togglePauseBtn = document.getElementById('toggle-pause-btn');
      const dockMinimizeBtn = document.getElementById('dock-minimize-btn');
      const dockBody = document.getElementById('dock-body');
      const remoteTextInput = document.getElementById('remote-text-input');
      const remoteTypeBtn = document.getElementById('remote-type-btn');

      if (dockMinimizeBtn && dockBody) {
        dockMinimizeBtn.addEventListener('click', () => {
          dockBody.classList.toggle('hidden');
          dockMinimizeBtn.textContent = dockBody.classList.contains('hidden') ? '▢' : '_';
        });
      }

      if (controlToggleBtn) {
        controlToggleBtn.addEventListener('click', () => {
          remoteControlActive = !remoteControlActive;
          controlToggleBtn.textContent = remoteControlActive ? '🖱️ Screen Click: Active' : '🖱️ Screen Click: Off';
          controlToggleBtn.classList.toggle('btn-primary', remoteControlActive);
          controlToggleBtn.classList.toggle('btn-ghost', !remoteControlActive);
          if (screencastImg) {
            screencastImg.style.cursor = remoteControlActive ? 'crosshair' : 'default';
          }
        });
      }

      function updateBotPauseState(paused) {
        isBotPaused = paused;
        if (togglePauseBtn) {
          togglePauseBtn.textContent = paused ? '▶️ Resume Bot Loop' : '⏸️ Pause Bot Loop';
          togglePauseBtn.classList.toggle('btn-success', paused);
          togglePauseBtn.classList.toggle('btn-warning', !paused);
        }
      }

      const saveSessionBtn = document.getElementById('save-session-btn');
      if (saveSessionBtn) {
        saveSessionBtn.addEventListener('click', () => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'save_session' }));
          }
        });
      }

      function showToast(text) {
        const toast = document.createElement('div');
        toast.className = 'dock-toast';
        toast.textContent = text;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 20);
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 400);
        }, 3000);
      }

      if (togglePauseBtn) {
        togglePauseBtn.addEventListener('click', () => {
          isBotPaused = !isBotPaused;
          updateBotPauseState(isBotPaused);
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'toggle_bot_pause', paused: isBotPaused }));
            // Auto-save cookies whenever user finishes manual control and resumes bot
            if (!isBotPaused) {
              ws.send(JSON.stringify({ action: 'save_session' }));
            }
          }
        });
      }

      // Handle direct mouse click forwarding on the game image
      if (screencastImg) {
        screencastImg.style.cursor = 'crosshair';
        screencastImg.addEventListener('click', (e) => {
          if (!remoteControlActive || !ws || ws.readyState !== WebSocket.OPEN) return;
          const rect = screencastImg.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;
          // Scale from CSS display coordinates to 1280x720 Playwright coordinates
          const x = Math.round((clickX / rect.width) * 1280);
          const y = Math.round((clickY / rect.height) * 720);

          ws.send(JSON.stringify({ action: 'manual_click', x, y }));

          // Automatically pause bot when user clicks so bot doesn't interfere with typing login
          if (!isBotPaused) {
            updateBotPauseState(true);
            ws.send(JSON.stringify({ action: 'toggle_bot_pause', paused: true }));
          }

          // Visual ripple feedback
          showClickRipple(e.clientX, e.clientY);
        });

        // Wheel scroll forwarding
        screencastImg.addEventListener('wheel', (e) => {
          if (!remoteControlActive || !ws || ws.readyState !== WebSocket.OPEN) return;
          ws.send(JSON.stringify({ action: 'manual_scroll', deltaY: e.deltaY }));
        }, { passive: true });
      }

      function showClickRipple(clientX, clientY) {
        const ripple = document.createElement('div');
        ripple.className = 'remote-click-ripple';
        ripple.style.left = `${clientX}px`;
        ripple.style.top = `${clientY}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 450);
      }

      // Keyboard & Text Input Sending
      function sendRemoteText() {
        if (!remoteTextInput || !ws || ws.readyState !== WebSocket.OPEN) return;
        const text = remoteTextInput.value;
        if (text) {
          ws.send(JSON.stringify({ action: 'manual_type', text }));
          remoteTextInput.value = '';
        }
      }

      if (remoteTypeBtn) remoteTypeBtn.addEventListener('click', sendRemoteText);
      if (remoteTextInput) {
        remoteTextInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            sendRemoteText();
          }
        });
      }

      const keyTabBtn = document.getElementById('remote-key-tab');
      if (keyTabBtn) keyTabBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'manual_key', key: 'Tab' }));
      });

      const keyEnterBtn = document.getElementById('remote-key-enter');
      if (keyEnterBtn) keyEnterBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'manual_key', key: 'Enter' }));
      });

      const keyBackBtn = document.getElementById('remote-key-backspace');
      if (keyBackBtn) keyBackBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'manual_key', key: 'Backspace' }));
      });

      const reloadBtn = document.getElementById('remote-reload-btn');
      if (reloadBtn) reloadBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ action: 'manual_goto', url: 'https://www.housebets.com/house-games' }));
      });

      // Hotkey: press 'c' to quickly toggle remote control dock visibility
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key.toLowerCase() === 'c') {
          if (remoteDock) {
            remoteDock.style.display = remoteDock.style.display === 'none' ? 'flex' : 'none';
          }
        }
      });

      // Auto-scale full-screen borderless overlay to fit any resolution or OBS canvas
      const container = document.getElementById('stream-container');
      function resizeOverlay() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        if (container) {
          container.style.transform = `scale(${scale})`;
          container.style.left = `${(window.innerWidth - 1920 * scale) / 2}px`;
          container.style.top = `${(window.innerHeight - 1080 * scale) / 2}px`;
        }
      }
      window.addEventListener('resize', resizeOverlay);
      resizeOverlay();

      // Poll telemetry every 2 seconds
      setInterval(async () => {
        try {
          await fetch('/api/status');
        } catch { }
      }, 2000);
    });
  </script>
</body>

</html>
