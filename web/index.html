<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hubie Live 24/7 — Housebets Mascot Streamer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="stream-container">
    <!-- TOP BAR -->
    <header id="top-bar">
      <div class="brand-section">
        <span class="live-badge">🔴 LIVE 24/7</span>
        <h1 class="brand-title">HOUSEBETS ORIGINALS</h1>
        <span class="active-game-pill" id="active-game-name">🌴 Hubie's Road</span>
      </div>

      <!-- 18+ & GAMBLE RESPONSIBLY DISCLAIMER -->
      <div class="safety-badge" id="safety-badge">
        🔞 18+ ONLY | PLAY RESPONSIBLY | BEGAMBLEAWARE.ORG
      </div>

      <!-- TELEMETRY & UPTIME -->
      <div class="telemetry-section">
        <div class="stat-pill">
          <span class="stat-label">Stream Uptime</span>
          <span class="stat-val" id="uptime-val">00h 00m 00s</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Rounds Played</span>
          <span class="stat-val" id="rounds-val">0</span>
        </div>
      </div>
    </header>

    <!-- MAIN GAME & CHAT STAGE -->
    <main id="main-stage">
      <!-- ACTUAL LIVE HOUSEBETS BROWSER SCREEN -->
      <section class="live-browser-panel">
        <div class="browser-header-bar">
          <div class="browser-dots">
            <span class="browser-dot dot-red"></span>
            <span class="browser-dot dot-yellow"></span>
            <span class="browser-dot dot-green"></span>
          </div>
          <div class="browser-url-pill" id="browser-url">
            https://www.housebets.com/games/housegames-hubie-s-road
          </div>
          <div style="font-size: 11px; color: #10b981; font-weight: 700;">
            ● LIVE SESSION
          </div>
        </div>

        <div class="live-screen-wrapper">
          <img id="live-screencast" alt="Live Housebets Gameplay" />
          <div class="screen-loading" id="screen-loading">
            <div class="spinner"></div>
            <span>Connecting to Housebets Live Game...</span>
          </div>
        </div>
      </section>

      <!-- LIVE CHAT -->
      <section class="chat-panel">
        <div class="chat-header">
          <span class="chat-title">STREAM CHAT</span>
          <span class="mod-tag">🛡️ AUTO-MODERATED</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="Say hi to Hubie..." maxlength="120" />
          <button id="chat-send-btn">Send</button>
        </div>
      </section>
    </main>

    <!-- BOTTOM AVATAR STAGE (Hubie Roams & Speaks Here) -->
    <footer id="avatar-stage">
      <div id="speech-bubble"></div>
      <canvas id="avatar-canvas" width="1920" height="240"></canvas>
    </footer>
  </div>

  <!-- Hidden Audio Player for Live Neural TTS -->
  <audio id="tts-audio" preload="auto"></audio>

  <!-- Load Avatar Script -->
  <script src="/hubie_avatar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const avatar = new HubieAvatar('avatar-canvas', 'speech-bubble');
      const audioElement = document.getElementById('tts-audio');

      const screencastImg = document.getElementById('live-screencast');
      const screenLoading = document.getElementById('screen-loading');
      const activeGameEl = document.getElementById('active-game-name');
      const browserUrlEl = document.getElementById('browser-url');
      const uptimeEl = document.getElementById('uptime-val');
      const roundsEl = document.getElementById('rounds-val');

      const chatMessagesEl = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const chatSendBtn = document.getElementById('chat-send-btn');

      // WebSocket Connection
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleServerMessage(msg);
        } catch (e) {
          console.error('WS Parse Error:', e);
        }
      };

      function handleServerMessage(msg) {
        if (msg.type === 'screencast_frame') {
          screencastImg.src = msg.data;
          if (screenLoading.style.display !== 'none') {
            screenLoading.style.display = 'none';
          }
        } else if (msg.type === 'init') {
          updateGameState(msg.game_state);
          updateTelemetry(msg.telemetry);
        } else if (msg.type === 'game_update') {
          const payload = msg.data;
          updateGameState(payload.game_state);

          if (payload.type === 'round_result') {
            const res = payload.event_data;
            if (res.won) {
              avatar.reactToWin(res.multiplier || 2.0);
            } else {
              avatar.reactToLoss();
            }
          }
        } else if (msg.type === 'hubie_speaking_start') {
          avatar.setSpeaking(true, msg.text);
          if (msg.audio_url) {
            audioElement.src = msg.audio_url;
            audioElement.play().catch(() => {});
          }
        } else if (msg.type === 'hubie_speaking_end') {
          avatar.setSpeaking(false);
        } else if (msg.type === 'chat_message') {
          appendChatMessage(msg.message.user, msg.message.text, msg.message.platform);
          if (msg.message.text.toLowerCase().includes('hubie')) {
            avatar.reactToChat(msg.message.user);
          }
        } else if (msg.type === 'chat_moderated') {
          appendModeratedNotice(msg.message.user);
        }
      }

      function updateGameState(state) {
        if (!state) return;
        if (state.display_name) {
          activeGameEl.textContent = `🎮 ${state.display_name}`;
        }
        if (state.game_url) {
          browserUrlEl.textContent = state.game_url;
        }
        if (state.total_rounds !== undefined) {
          roundsEl.textContent = state.total_rounds;
        }
      }

      function updateTelemetry(telem) {
        if (!telem) return;
        if (telem.uptime) {
          uptimeEl.textContent = telem.uptime;
        }
        if (telem.rounds_played !== undefined) {
          roundsEl.textContent = telem.rounds_played;
        }
      }

      function appendChatMessage(user, text, platform) {
        const item = document.createElement('div');
        item.className = 'chat-item';

        let badge = '<span class="chat-badge live">LIVE</span>';
        if (platform === 'kick') {
          badge = '<span class="chat-badge kick">KICK</span>';
        } else if (platform === 'twitch') {
          badge = '<span class="chat-badge twitch">TWITCH</span>';
        }

        item.innerHTML = `${badge}<span class="chat-user">@${user}:</span><span class="chat-text">${escapeHtml(text)}</span>`;
        chatMessagesEl.appendChild(item);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        if (chatMessagesEl.children.length > 50) {
          chatMessagesEl.removeChild(chatMessagesEl.firstChild);
        }
      }

      function appendModeratedNotice(user) {
        const item = document.createElement('div');
        item.className = 'chat-item moderated';
        item.innerHTML = `<span class="chat-mod-notice">🛡️ [Auto-Mod] Removed toxic message from @${escapeHtml(user)}</span>`;
        chatMessagesEl.appendChild(item);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function sendChat() {
        const text = chatInput.value.trim();
        if (text) {
          ws.send(JSON.stringify({ action: 'manual_chat', user: 'Viewer', text }));
          chatInput.value = '';
        }
      }

      chatSendBtn.addEventListener('click', sendChat);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChat();
      });

      // Poll telemetry every second
      setInterval(async () => {
        try {
          const res = await fetch('/api/status');
          if (res.ok) {
            const data = await res.json();
            updateTelemetry(data);
          }
        } catch {}
      }, 1000);
    });
  </script>
</body>
</html>
